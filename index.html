<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>こん虫の体のつくり</title>

<style>

body{
    margin:0;
    background:#efefef;
    font-family:sans-serif;
    text-align:center;
}

.stage{
    position:relative;
    width:100%;
    max-width:1600px;
    margin:auto;
}

.stage img{
    width:100%;
    display:block;
}

.overlay{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    display:none;
}

.buttons{
    position:fixed;
    bottom:20px;
    left:0;
    right:0;
    z-index:1000;
}

button{
    font-size:32px;
    padding:12px 28px;
    margin:8px;
    border-radius:25px;
    background:black;
    color:white;
    cursor:pointer;
}

.reset{
    background:white;
    color:black;
    border:3px solid black;
}

</style>
</head>

<body>

<div class="stage">

<img src="base.png">

<img id="head" class="overlay" src="head.png">
<img id="thorax" class="overlay" src="thorax.png">
<img id="abdomen" class="overlay" src="abdomen.png">
<img id="antenna" class="overlay" src="antenna.png">
<img id="leg" class="overlay" src="leg.png">
<img id="eye" class="overlay" src="eye.png">

</div>
    
<div class="buttons">
    <button onclick="toggleLayer('head')">頭</button>
    <button onclick="toggleLayer('thorax')">むね</button>
    <button onclick="toggleLayer('abdomen')">はら</button>
    <button onclick="toggleLayer('antenna')">しょっ角</button>
    <button onclick="toggleLayer('leg')">あし</button>
    <button onclick="toggleLayer('eye')">目</button>
    <button class="reset" onclick="resetLayers()">リセット</button>
</div>

<script>

function toggleLayer(id){

    const layer=document.getElementById(id);

    if(layer.style.display==="block"){
        layer.style.display="none";
    }else{
        layer.style.display="block";
    }

}

function resetLayers(){

    document.querySelectorAll(".overlay")
    .forEach(layer=>{
        layer.style.display="none";
    });

}

</script>

</body>
</html>
