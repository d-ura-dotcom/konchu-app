<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>こん虫の体のつくり</title>

<style>
body{
  margin:0;
  background:#efefef;
  font-family:sans-serif;
  text-align:center;
}

h1{
  font-size:48px;
}

.container{
  display:flex;
  justify-content:space-around;
}

.card{
  width:30%;
  min-width:250px;
}

img{
  width:auto;
  height:420px;
}

.buttons{
  position:fixed;
  bottom:20px;
  left:0;
  right:0;
  z-index:1000;
}

button{
  font-size:32px;
  padding:12px 28px;
  margin:8px;
  border-radius:25px;
  background:black;
  color:white;
}

button:last-child{
  background:white;
  color:black;
  border:3px solid black;
}
</style>
</head>

<body>

<h1>こん虫の体のつくりを見てみよう</h1>

<div class="container">

<div class="card">
<h2>カブトムシ</h2>
<img src="kabuto.png">
</div>

<div class="card">
<h2>ショウリョウバッタ</h2>
<img src="batta.png">
</div>
  
<div class="card">
<h2>アキアカネ</h2>
<img src="akiakane.png" style="height:460px;">
</div>

</div>

<div class="buttons">
<button>頭</button>
<button>むね</button>
<button>はら</button>
<button>しょっ角</button>
<button>あし</button>
<button>目</button>
<button>リセット</button>
</div>

</body>
</html>
